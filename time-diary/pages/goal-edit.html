<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目标设置</title>
    <style id="theme-vars">
/* ============================================================
   时间日记 · 二次元风格设计令牌 (Design Tokens)
   风格基调：奶油暖底 + 蜜桃珊瑚主色 + 樱花粉点缀
   参考「爱时间」的信息架构 × 二次元轻量插画氛围
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一主色相：蜜桃珊瑚） ---------- */
  --diary-primary: #ff8a7a;            /* 品牌主色：蜜桃珊瑚 */
  --diary-primary-strong: #f97a68;     /* 主色深一档（按压态） */
  --diary-primary-soft: #fff0ec;       /* 主色 8% 浅底（选中/标签底） */
  --diary-primary-tint: #ffe4dc;       /* 主色浅色阶（进度条底） */
  --diary-primary-ink: #ffffff;        /* 主色上的文字 */

  /* ---------- 中性色（暖灰奶油系） ---------- */
  --diary-background: #fffaf7;         /* 页面底：奶油白 */
  --diary-surface: #ffffff;            /* 卡片面 */
  --diary-surface-2: #fff3ee;          /* 次级面 / 悬停 */
  --diary-foreground: #4a3530;         /* 主文字：暖深棕 */
  --diary-muted: #fff1ec;              /* 弱化面 */
  --diary-muted-foreground: #a08a82;   /* 弱化文字 */
  --diary-border: #f6e3dc;             /* 分隔线 / 描边 */
  --diary-input: #f6e3dc;              /* 输入框描边 */
  --diary-ring: rgba(255, 138, 122, 0.35); /* 聚焦环 */

  /* ---------- 语义别名（head 契约必需映射） ---------- */
  --diary-card: var(--diary-surface);
  --diary-card-foreground: var(--diary-foreground);
  --diary-popover: var(--diary-surface);
  --diary-popover-foreground: var(--diary-foreground);
  --diary-primary-foreground: var(--diary-primary-ink);

  /* ---------- 语义状态色（仅用于状态） ---------- */
  --state-success: #7bc8a4;
  --state-warning: #f2b86b;
  --state-error: #ef7d78;
  --state-info: #7fb5d9;

  /* ---------- 排版 ---------- */
  --diary-font-primary: "Inter", "HarmonyOS Sans SC", "PingFang SC", "MiSans", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --diary-font-display: "Inter", "HarmonyOS Sans SC", "PingFang SC", "MiSans", "Noto Sans SC", system-ui, sans-serif;

  /* ---------- 圆角（二次元柔和风格，卡片最大 20px） ---------- */
  --diary-radius-small: 4px;
  --diary-radius-medium: 12px;
  --diary-radius-large: 20px;
  --diary-radius-full: 9999px;

  /* ---------- 阴影（静态面极浅，浮层可更深） ---------- */
  --diary-shadow-1: 0 1px 2px rgba(143, 74, 58, 0.05), 0 1px 1px rgba(143, 74, 58, 0.03);
  --diary-shadow-2: 0 8px 24px -8px rgba(143, 74, 58, 0.18);
  --diary-shadow-3: 0 24px 60px -20px rgba(143, 74, 58, 0.30);
}

/* ---------- 暗色模式（午夜暖棕） ---------- */
.dark {
  --diary-primary: #ff9a8c;
  --diary-primary-strong: #ffab9e;
  --diary-primary-soft: rgba(255, 154, 140, 0.16);
  --diary-primary-tint: rgba(255, 154, 140, 0.10);
  --diary-primary-ink: #3a2119;

  --diary-background: #1c1513;
  --diary-surface: #251d1a;
  --diary-surface-2: #2e2420;
  --diary-foreground: #f3e8e2;
  --diary-muted: #2e2420;
  --diary-muted-foreground: #a8948a;
  --diary-border: #3a2c27;
  --diary-input: #3a2c27;
  --diary-ring: rgba(255, 154, 140, 0.40);

  --diary-card: var(--diary-surface);
  --diary-card-foreground: var(--diary-foreground);
  --diary-popover: var(--diary-surface);
  --diary-popover-foreground: var(--diary-foreground);
  --diary-primary-foreground: var(--diary-primary-ink);

  --diary-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25);
  --diary-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --diary-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);
}

/* ============================================================
   排版类（Typography Classes）
   ============================================================ */
.diary-display {
  font-family: var(--diary-font-display);
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--diary-foreground);
  text-wrap: balance;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.diary-h1 {
  font-family: var(--diary-font-display);
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--diary-foreground);
  text-wrap: balance;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.diary-h2 {
  font-family: var(--diary-font-display);
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--diary-foreground);
}
.diary-h3 {
  font-family: var(--diary-font-display);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--diary-foreground);
}
.diary-body {
  font-family: var(--diary-font-primary);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--diary-foreground);
}
.diary-body-large {
  font-family: var(--diary-font-primary);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--diary-foreground);
}
.diary-caption {
  font-family: var(--diary-font-primary);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--diary-muted-foreground);
}
.diary-num {
  font-family: var(--diary-font-primary);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   通用组件基类（二次元风格统一语言）
   ============================================================ */
.diary-card {
  background: var(--diary-surface);
  border: 1px solid var(--diary-border);
  border-radius: var(--diary-radius-large);
  box-shadow: var(--diary-shadow-1);
}
.diary-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 10px;
  border-radius: var(--diary-radius-full);
  background: var(--diary-surface-2);
  color: var(--diary-foreground);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.diary-chip-primary {
  background: var(--diary-primary-soft);
  color: var(--diary-primary-strong);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--diary-background);
    --color-foreground: var(--diary-foreground);
    --color-card: var(--diary-card);
    --color-card-foreground: var(--diary-card-foreground);
    --color-popover: var(--diary-popover);
    --color-popover-foreground: var(--diary-popover-foreground);
    --color-primary: var(--diary-primary);
    --color-primary-foreground: var(--diary-primary-foreground);
    --color-muted: var(--diary-muted);
    --color-muted-foreground: var(--diary-muted-foreground);
    --color-border: var(--diary-border);
    --color-input: var(--diary-input);
    --color-ring: var(--diary-ring);
    --radius-sm: var(--diary-radius-small);
    --radius-md: var(--diary-radius-medium);
    --radius-lg: var(--diary-radius-large);
  }
  @layer base {
    body { background: var(--diary-background); color: var(--diary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--diary-background); }
      .text-background { color: var(--diary-background); }
      .border-background { border-color: var(--diary-background); }
      .ring-background { --tw-ring-color: var(--diary-background); }
      .bg-foreground { background-color: var(--diary-foreground); }
      .text-foreground { color: var(--diary-foreground); }
      .border-foreground { border-color: var(--diary-foreground); }
      .ring-foreground { --tw-ring-color: var(--diary-foreground); }
      .bg-card { background-color: var(--diary-card); }
      .text-card { color: var(--diary-card); }
      .border-card { border-color: var(--diary-card); }
      .ring-card { --tw-ring-color: var(--diary-card); }
      .bg-card-foreground { background-color: var(--diary-card-foreground); }
      .text-card-foreground { color: var(--diary-card-foreground); }
      .border-card-foreground { border-color: var(--diary-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--diary-card-foreground); }
      .bg-popover { background-color: var(--diary-popover); }
      .text-popover { color: var(--diary-popover); }
      .border-popover { border-color: var(--diary-popover); }
      .ring-popover { --tw-ring-color: var(--diary-popover); }
      .bg-popover-foreground { background-color: var(--diary-popover-foreground); }
      .text-popover-foreground { color: var(--diary-popover-foreground); }
      .border-popover-foreground { border-color: var(--diary-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--diary-popover-foreground); }
      .bg-primary { background-color: var(--diary-primary); }
      .text-primary { color: var(--diary-primary); }
      .border-primary { border-color: var(--diary-primary); }
      .ring-primary { --tw-ring-color: var(--diary-primary); }
      .bg-primary-foreground { background-color: var(--diary-primary-foreground); }
      .text-primary-foreground { color: var(--diary-primary-foreground); }
      .border-primary-foreground { border-color: var(--diary-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--diary-primary-foreground); }
      .bg-muted { background-color: var(--diary-muted); }
      .text-muted { color: var(--diary-muted); }
      .border-muted { border-color: var(--diary-muted); }
      .ring-muted { --tw-ring-color: var(--diary-muted); }
      .bg-muted-foreground { background-color: var(--diary-muted-foreground); }
      .text-muted-foreground { color: var(--diary-muted-foreground); }
      .border-muted-foreground { border-color: var(--diary-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--diary-muted-foreground); }
      .bg-border { background-color: var(--diary-border); }
      .text-border { color: var(--diary-border); }
      .border-border { border-color: var(--diary-border); }
      .ring-border { --tw-ring-color: var(--diary-border); }
      .bg-input { background-color: var(--diary-input); }
      .text-input { color: var(--diary-input); }
      .border-input { border-color: var(--diary-input); }
      .ring-input { --tw-ring-color: var(--diary-input); }
      .bg-ring { background-color: var(--diary-ring); }
      .text-ring { color: var(--diary-ring); }
      .border-ring { border-color: var(--diary-ring); }
      .ring-ring { --tw-ring-color: var(--diary-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-8">
    <!-- 浮层顶栏 -->
    <header class="sticky top-0 z-30 -mx-4 mb-4 flex h-14 items-center justify-between border-b border-[var(--diary-border)] bg-[var(--diary-background)]/95 px-4 backdrop-blur">
      <button type="button" data-dom-id="close-goal" class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-[var(--diary-muted-foreground)] transition-colors hover:bg-[var(--diary-surface-2)]" aria-label="关闭">
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
      <h1 class="diary-h3">目标设置</h1>
      <button type="button" class="inline-flex h-9 items-center gap-1 rounded-lg bg-[var(--diary-primary)] px-3 text-[13px] font-semibold text-[var(--diary-primary-ink)] transition-transform hover:-translate-y-0.5" aria-label="保存目标">
        <span class="whitespace-nowrap">保存</span>
      </button>
    </header>

    <!-- 目标名称 -->
    <section class="diary-card px-4 py-4">
      <label for="goal-name" class="mb-1.5 block text-[13px] font-medium text-[var(--diary-foreground)]">目标名称</label>
      <input id="goal-name" type="text" value="每天学习 2 小时" aria-label="目标名称" class="h-11 w-full rounded-xl border border-[var(--diary-input)] bg-[var(--diary-surface)] px-3 text-[15px] text-[var(--diary-foreground)] outline-none transition-shadow placeholder:text-[var(--diary-muted-foreground)] focus:ring-2 focus:ring-[var(--diary-ring)]" placeholder="如：每天阅读 30 分钟" />
      <p class="mt-1.5 text-[12px] text-[var(--diary-muted-foreground)]">给目标起一个清晰的名字，方便追踪</p>
    </section>

    <!-- 目标时长 -->
    <section class="diary-card mt-4 px-4 py-4">
      <h2 class="diary-h3 mb-3">目标时长</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="goal-hours" class="mb-1.5 block text-[12px] text-[var(--diary-muted-foreground)]">小时</label>
          <input id="goal-hours" type="number" min="0" max="24" value="2" class="h-11 w-full rounded-xl border border-[var(--diary-input)] bg-[var(--diary-surface)] px-3 text-[15px] text-[var(--diary-foreground)] outline-none transition-shadow focus:ring-2 focus:ring-[var(--diary-ring)]" />
        </div>
        <div>
          <label for="goal-minutes" class="mb-1.5 block text-[12px] text-[var(--diary-muted-foreground)]">分钟</label>
          <input id="goal-minutes" type="number" min="0" max="59" value="0" class="h-11 w-full rounded-xl border border-[var(--diary-input)] bg-[var(--diary-surface)] px-3 text-[15px] text-[var(--diary-foreground)] outline-none transition-shadow focus:ring-2 focus:ring-[var(--diary-ring)]" />
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2 rounded-xl bg-[var(--diary-primary-soft)] px-3 py-2.5">
        <i data-lucide="clock-3" class="h-4 w-4 shrink-0 text-[var(--diary-primary-strong)]"></i>
        <span class="text-[13px] text-[var(--diary-primary-strong)]">每日需投入 2 小时</span>
      </div>
    </section>

    <!-- 关联分类 -->
    <section class="diary-card mt-4 px-4 py-4">
      <h2 class="diary-h3 mb-3">关联活动</h2>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="cat-pill cat-pill-selected">学习</button>
        <button type="button" class="cat-pill">工作</button>
        <button type="button" class="cat-pill">阅读</button>
        <button type="button" class="cat-pill">运动</button>
        <button type="button" class="cat-pill">休息</button>
        <button type="button" class="cat-pill">娱乐</button>
      </div>
      <p class="mt-2.5 text-[12px] text-[var(--diary-muted-foreground)]">完成进度将按所选活动的记录时长自动累计</p>
    </section>

    <!-- 重复周期 -->
    <section class="diary-card mt-4 px-4 py-4">
      <h2 class="diary-h3 mb-3">重复周期</h2>
      <div class="flex items-center gap-2 rounded-xl border border-[var(--diary-border)] p-1">
        <button type="button" class="flex-1 whitespace-nowrap rounded-lg py-2 text-[13px] font-medium text-[var(--diary-muted-foreground)] transition-colors">每天</button>
        <button type="button" class="flex-1 whitespace-nowrap rounded-lg py-2 text-[13px] font-medium text-[var(--diary-muted-foreground)] transition-colors">工作日</button>
        <button type="button" class="flex-1 whitespace-nowrap rounded-lg bg-[var(--diary-primary-soft)] py-2 text-[13px] font-semibold text-[var(--diary-primary-strong)] transition-colors">每周</button>
        <button type="button" class="flex-1 whitespace-nowrap rounded-lg py-2 text-[13px] font-medium text-[var(--diary-muted-foreground)] transition-colors">仅一次</button>
      </div>
    </section>

    <!-- 提醒设置 -->
    <section class="diary-card mt-4 flex items-center justify-between px-4 py-4">
      <div class="min-w-0">
        <h2 class="text-[15px] font-semibold text-[var(--diary-foreground)]">打卡提醒</h2>
        <p class="mt-0.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">每天 20:00 提醒今日目标进度</p>
      </div>
      <span class="toggle on" role="switch" aria-checked="true" aria-label="打卡提醒开关"></span>
    </section>

    <!-- 二次元装饰 -->
    <section class="mt-4 flex items-center justify-center gap-4 px-4 py-4">
      <svg class="h-7 w-7 text-[var(--diary-primary)]" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 6c-8 0-14 5-14 12 0 4 2 7 5 9v4c0 2 1 3 3 3h12c2 0 3-1 3-3v-4c3-2 5-5 5-9 0-7-6-12-14-12z" fill="var(--diary-primary-tint)"/>
        <circle cx="19" cy="18" r="2" fill="var(--diary-primary)"/>
        <circle cx="29" cy="18" r="2" fill="var(--diary-primary)"/>
        <path d="M20 24c2 2 6 2 8 0" stroke="var(--diary-primary-strong)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="diary-caption">坚持，时间会给你答案</p>
      <svg class="h-5 w-5 text-[var(--diary-primary-tint)]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.4 6.2L21 9l-5 4.1 1.8 6.4L12 16l-5.8 3.5L8 13.1 3 9l6.6-.8z"/>
      </svg>
    </section>
</main>
    <style id="critical-layout">
      .diary-card { background: var(--diary-surface); border: 1px solid var(--diary-border); border-radius: var(--diary-radius-large); box-shadow: var(--diary-shadow-1); }
      .diary-h3 { font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--diary-foreground); }
      .diary-caption { font-size: 13px; line-height: 1.5; color: var(--diary-muted-foreground); }
      .cat-pill { display: inline-flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--diary-border); background: var(--diary-surface); color: var(--diary-muted-foreground); font-size: 13px; transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
      .cat-pill:hover { background: var(--diary-surface-2); }
      .cat-pill-selected { background: var(--diary-primary-soft); border-color: var(--diary-primary); color: var(--diary-primary-strong); font-weight: 500; }
      .toggle { position: relative; display: inline-flex; width: 46px; height: 26px; border-radius: 9999px; background: var(--diary-muted-foreground); transition: background-color .2s ease; }
      .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 9999px; background: var(--diary-surface); transition: transform .2s ease; }
      .toggle.on { background: var(--diary-primary); }
      .toggle.on::after { transform: translateX(20px); }
      @media (prefers-reduced-motion: reduce) { .cat-pill, .toggle, .toggle::after, header button { transition: none !important; } }
    </style>
    <script>lucide.createIcons();</script>
</body>
</html>
