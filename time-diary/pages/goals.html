<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>目标</title>
    <style id="theme-vars">
/* ============================================================
   时间日记 · 二次元风格设计令牌 (Design Tokens)
   风格基调：奶油暖底 + 蜜桃珊瑚主色 + 樱花粉点缀
   参考「爱时间」的信息架构 × 二次元轻量插画氛围
   ============================================================ */

:root {
  /* ---------- 品牌主色（单一主色相：蜜桃珊瑚） ---------- */
  --diary-primary: #ff8a7a;            /* 品牌主色：蜜桃珊瑚 */
  --diary-primary-strong: #f97a68;     /* 主色深一档（按压态） */
  --diary-primary-soft: #fff0ec;       /* 主色 8% 浅底（选中/标签底） */
  --diary-primary-tint: #ffe4dc;       /* 主色浅色阶（进度条底） */
  --diary-primary-ink: #ffffff;        /* 主色上的文字 */

  /* ---------- 中性色（暖灰奶油系） ---------- */
  --diary-background: #fffaf7;         /* 页面底：奶油白 */
  --diary-surface: #ffffff;            /* 卡片面 */
  --diary-surface-2: #fff3ee;          /* 次级面 / 悬停 */
  --diary-foreground: #4a3530;         /* 主文字：暖深棕 */
  --diary-muted: #fff1ec;              /* 弱化面 */
  --diary-muted-foreground: #a08a82;   /* 弱化文字 */
  --diary-border: #f6e3dc;             /* 分隔线 / 描边 */
  --diary-input: #f6e3dc;              /* 输入框描边 */
  --diary-ring: rgba(255, 138, 122, 0.35); /* 聚焦环 */

  /* ---------- 语义别名（head 契约必需映射） ---------- */
  --diary-card: var(--diary-surface);
  --diary-card-foreground: var(--diary-foreground);
  --diary-popover: var(--diary-surface);
  --diary-popover-foreground: var(--diary-foreground);
  --diary-primary-foreground: var(--diary-primary-ink);

  /* ---------- 语义状态色（仅用于状态） ---------- */
  --state-success: #7bc8a4;
  --state-warning: #f2b86b;
  --state-error: #ef7d78;
  --state-info: #7fb5d9;

  /* ---------- 排版 ---------- */
  --diary-font-primary: "Inter", "HarmonyOS Sans SC", "PingFang SC", "MiSans", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --diary-font-display: "Inter", "HarmonyOS Sans SC", "PingFang SC", "MiSans", "Noto Sans SC", system-ui, sans-serif;

  /* ---------- 圆角（二次元柔和风格，卡片最大 20px） ---------- */
  --diary-radius-small: 4px;
  --diary-radius-medium: 12px;
  --diary-radius-large: 20px;
  --diary-radius-full: 9999px;

  /* ---------- 阴影（静态面极浅，浮层可更深） ---------- */
  --diary-shadow-1: 0 1px 2px rgba(143, 74, 58, 0.05), 0 1px 1px rgba(143, 74, 58, 0.03);
  --diary-shadow-2: 0 8px 24px -8px rgba(143, 74, 58, 0.18);
  --diary-shadow-3: 0 24px 60px -20px rgba(143, 74, 58, 0.30);
}

/* ---------- 暗色模式（午夜暖棕） ---------- */
.dark {
  --diary-primary: #ff9a8c;
  --diary-primary-strong: #ffab9e;
  --diary-primary-soft: rgba(255, 154, 140, 0.16);
  --diary-primary-tint: rgba(255, 154, 140, 0.10);
  --diary-primary-ink: #3a2119;

  --diary-background: #1c1513;
  --diary-surface: #251d1a;
  --diary-surface-2: #2e2420;
  --diary-foreground: #f3e8e2;
  --diary-muted: #2e2420;
  --diary-muted-foreground: #a8948a;
  --diary-border: #3a2c27;
  --diary-input: #3a2c27;
  --diary-ring: rgba(255, 154, 140, 0.40);

  --diary-card: var(--diary-surface);
  --diary-card-foreground: var(--diary-foreground);
  --diary-popover: var(--diary-surface);
  --diary-popover-foreground: var(--diary-foreground);
  --diary-primary-foreground: var(--diary-primary-ink);

  --diary-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.25);
  --diary-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.45);
  --diary-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.60);
}

/* ============================================================
   排版类（Typography Classes）
   ============================================================ */
.diary-display {
  font-family: var(--diary-font-display);
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--diary-foreground);
  text-wrap: balance;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.diary-h1 {
  font-family: var(--diary-font-display);
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--diary-foreground);
  text-wrap: balance;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.diary-h2 {
  font-family: var(--diary-font-display);
  font-size: clamp(20px, 2.6vw, 28px);
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--diary-foreground);
}
.diary-h3 {
  font-family: var(--diary-font-display);
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--diary-foreground);
}
.diary-body {
  font-family: var(--diary-font-primary);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--diary-foreground);
}
.diary-body-large {
  font-family: var(--diary-font-primary);
  font-size: 17px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--diary-foreground);
}
.diary-caption {
  font-family: var(--diary-font-primary);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 0.005em;
  color: var(--diary-muted-foreground);
}
.diary-num {
  font-family: var(--diary-font-primary);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   通用组件基类（二次元风格统一语言）
   ============================================================ */
.diary-card {
  background: var(--diary-surface);
  border: 1px solid var(--diary-border);
  border-radius: var(--diary-radius-large);
  box-shadow: var(--diary-shadow-1);
}
.diary-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 24px;
  padding: 0 10px;
  border-radius: var(--diary-radius-full);
  background: var(--diary-surface-2);
  color: var(--diary-foreground);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.diary-chip-primary {
  background: var(--diary-primary-soft);
  color: var(--diary-primary-strong);
}

    </style>

    <style type="text/tailwindcss">

    --color-background: var(--diary-background);
    --color-foreground: var(--diary-foreground);

    --color-card-foreground: var(--diary-card-foreground);
    --color-popover: var(--diary-popover);
    --color-popover-foreground: var(--diary-popover-foreground);
    --color-primary: var(--diary-primary);
    --color-primary-foreground: var(--diary-primary-foreground);
    --color-muted: var(--diary-muted);
    --color-muted-foreground: var(--diary-muted-foreground);
    --color-border: var(--diary-border);
    --color-input: var(--diary-input);
    --color-ring: var(--diary-ring);
    --radius-sm: var(--diary-radius-small);
    --radius-md: var(--diary-radius-medium);
    --radius-lg: var(--diary-radius-large);
  }
  @layer base {
    body { background: var(--diary-background); color: var(--diary-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-md mx-auto px-4 pb-4">
    <!-- 页头 -->
    <header class="flex items-center justify-between pt-5 pb-4">
      <div class="min-w-0">
        <h1 class="diary-h3">目标</h1>
        <p class="diary-caption mt-1">坚持，时间会给你答案</p>
      </div>
      <a href="#" data-dom-id="cta-goal-add" class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--diary-primary)] text-[var(--diary-primary-ink)] shadow-[var(--diary-shadow-2)] transition-transform hover:-translate-y-0.5" aria-label="新建目标">
        <i data-lucide="plus" class="h-5 w-5"></i>
      </a>
    </header>

    <!-- 本周目标概览 -->
    <section class="diary-card px-4 py-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="diary-h3">本周目标</h2>
        <span class="diary-chip">第 32 周</span>
      </div>
      <div class="grid grid-cols-3 divide-x divide-[var(--diary-border)]">
        <div class="min-w-0 pr-3">
          <p class="diary-num whitespace-nowrap text-[22px] font-bold leading-none text-[var(--diary-foreground)]">3<span class="text-[12px] font-medium text-[var(--diary-muted-foreground)]">/5</span></p>
          <p class="mt-1.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">目标达成</p>
        </div>
        <div class="min-w-0 px-3">
          <p class="diary-num whitespace-nowrap text-[22px] font-bold leading-none text-[var(--diary-foreground)]">21<span class="text-[12px] font-medium text-[var(--diary-muted-foreground)]">h</span></p>
          <p class="mt-1.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">累计专注 / 25h</p>
        </div>
        <div class="min-w-0 pl-3">
          <p class="diary-num whitespace-nowrap text-[22px] font-bold leading-none text-[var(--diary-foreground)]">5<span class="text-[12px] font-medium text-[var(--diary-muted-foreground)]">天</span></p>
          <p class="mt-1.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">连续打卡</p>
        </div>
      </div>
      <div class="mt-3 h-2 overflow-hidden rounded-full bg-[var(--diary-primary-tint)]">
        <div class="h-full w-[84%] rounded-full bg-[var(--diary-primary)]"></div>
      </div>
      <p class="mt-2 text-[12px] text-[var(--diary-muted-foreground)]">本周累计专注 21 小时，距离目标还差 4 小时</p>
    </section>

    <!-- 目标列表 -->
    <section class="mt-4 space-y-3">
      <h2 class="diary-h3 px-1">我的目标</h2>

      <article class="diary-card px-4 py-4 transition-transform hover:-translate-y-0.5">
        <div class="flex items-center gap-2.5">
          <span class="h-3 w-3 shrink-0 rounded-full bg-[#7fb5d9]"></span>
          <div class="min-w-0 flex-1">
            <h3 class="truncate text-[15px] font-semibold text-[var(--diary-foreground)]">每天学习 2 小时</h3>
            <p class="mt-0.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">关联：学习 · 每日</p>
          </div>
          <span class="diary-chip diary-chip-primary shrink-0">已完成 1h30m/2h</span>
        </div>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-[var(--diary-primary-tint)]">
          <div class="h-full w-[75%] rounded-full bg-[var(--diary-primary)]"></div>
        </div>
        <button type="button" class="mt-3 inline-flex h-9 w-full items-center justify-center gap-1.5 rounded-xl bg-[var(--diary-primary)] text-[13px] font-semibold text-[var(--diary-primary-ink)] transition-transform hover:-translate-y-0.5 active:translate-y-0">
          <i data-lucide="check-circle-2" class="h-4 w-4"></i>
          <span class="whitespace-nowrap">打卡</span>
        </button>
      </article>

      <article class="diary-card px-4 py-4 transition-transform hover:-translate-y-0.5">
        <div class="flex items-center gap-2.5">
          <span class="h-3 w-3 shrink-0 rounded-full bg-[#f2b86b]"></span>
          <div class="min-w-0 flex-1">
            <h3 class="truncate text-[15px] font-semibold text-[var(--diary-foreground)]">每周运动 3 次</h3>
            <p class="mt-0.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">关联：运动 · 每周</p>
          </div>
          <span class="diary-chip shrink-0 chip-warn">2/3 次</span>
        </div>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-[var(--diary-primary-tint)]">
          <div class="h-full w-[66%] rounded-full bg-[var(--diary-primary)]"></div>
        </div>
        <button type="button" class="mt-3 inline-flex h-9 w-full items-center justify-center gap-1.5 rounded-xl border border-[var(--diary-border)] bg-[var(--diary-surface-2)] text-[13px] font-semibold text-[var(--diary-foreground)] transition-transform hover:-translate-y-0.5 active:translate-y-0">
          <i data-lucide="check-circle-2" class="h-4 w-4"></i>
          <span class="whitespace-nowrap">记录一次</span>
        </button>
      </article>

      <article class="diary-card px-4 py-4 transition-transform hover:-translate-y-0.5">
        <div class="flex items-center gap-2.5">
          <span class="h-3 w-3 shrink-0 rounded-full bg-[#e893b6]"></span>
          <div class="min-w-0 flex-1">
            <h3 class="truncate text-[15px] font-semibold text-[var(--diary-foreground)]">每天阅读 30 分钟</h3>
            <p class="mt-0.5 truncate text-[12px] text-[var(--diary-muted-foreground)]">关联：阅读 · 每日</p>
          </div>
          <span class="diary-chip shrink-0 chip-ok">超额 10m</span>
        </div>
        <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-[var(--diary-primary-tint)]">
          <div class="h-full w-full rounded-full bg-[var(--state-success)]"></div>
        </div>
        <button type="button" disabled class="mt-3 inline-flex h-9 w-full items-center justify-center gap-1.5 rounded-xl bg-[var(--diary-muted)] text-[13px] font-medium text-[var(--diary-muted-foreground)]">
          <i data-lucide="check-circle-2" class="h-4 w-4"></i>
          <span class="whitespace-nowrap">今日已达成</span>
        </button>
      </article>
    </section>

    <!-- 习惯打卡 -->
    <section class="diary-card mt-4 px-4 py-4">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="diary-h3">习惯打卡</h2>
        <span class="diary-caption">本周</span>
      </div>
      <div class="grid grid-cols-7 gap-1.5">
        <button type="button" class="flex h-10 items-center justify-center rounded-lg text-[12px] text-[var(--state-success)]" aria-label="周一已打卡">
          <i data-lucide="check" class="h-4 w-4"></i>
        </button>
        <button type="button" class="flex h-10 items-center justify-center rounded-lg text-[12px] text-[var(--state-success)]" aria-label="周二已打卡">
          <i data-lucide="check" class="h-4 w-4"></i>
        </button>
        <button type="button" class="flex h-10 items-center justify-center rounded-lg text-[12px] text-[var(--state-success)]" aria-label="周三已打卡">
          <i data-lucide="check" class="h-4 w-4"></i>
        </button>
        <button type="button" class="flex h-10 items-center justify-center rounded-lg text-[12px] text-[var(--state-success)]" aria-label="周四已打卡">
          <i data-lucide="check" class="h-4 w-4"></i>
        </button>
        <button type="button" class="checkin-today flex h-10 items-center justify-center rounded-lg text-[12px] font-medium text-[var(--diary-primary-strong)]" aria-label="周五今日待打卡">
          <i data-lucide="check" class="h-4 w-4"></i>
        </button>
        <button type="button" class="flex h-10 items-center justify-center rounded-lg border border-dashed border-[var(--diary-border)] text-[12px] text-[var(--diary-muted-foreground)]" aria-label="周六未打卡"></button>
        <button type="button" class="flex h-10 items-center justify-center rounded-lg border border-dashed border-[var(--diary-border)] text-[12px] text-[var(--diary-muted-foreground)]" aria-label="周日未打卡"></button>
      </div>
      <div class="mt-3 flex items-center justify-center gap-1.5 border-t border-[var(--diary-border)] pt-3">
        <svg class="h-4 w-4 text-[var(--diary-primary)]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2l2.4 6.2L21 9l-5 4.1 1.8 6.4L12 16l-5.8 3.5L8 13.1 3 9l6.6-.8z"/>
        </svg>
        <p class="text-[12px] text-[var(--diary-muted-foreground)]">本周连续打卡 5 天，继续保持！</p>
      </div>
    </section>

    <!-- 鼓励语 -->
    <section class="mt-4 flex flex-col items-center gap-2 px-4 py-4 text-center">
      <img src="../assets/goal-celebrate.png" alt="达成目标欢呼庆祝插画" class="celebrate-illustration h-36 w-full max-w-[260px] object-contain" />
      <p class="diary-caption">每天进步一点点，时间看得见</p>
    </section>
</main>
    <style id="critical-layout">
      .diary-card { background: var(--diary-surface); border: 1px solid var(--diary-border); border-radius: var(--diary-radius-large); box-shadow: var(--diary-shadow-1); }
      .diary-chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 9999px; background: var(--diary-surface-2); color: var(--diary-foreground); font-size: 12px; font-weight: 500; white-space: nowrap; }
      .diary-chip-primary { background: var(--diary-primary-soft); color: var(--diary-primary-strong); }
      .chip-warn { background: color-mix(in srgb, var(--state-warning) 18%, transparent); color: color-mix(in srgb, var(--state-warning) 65%, var(--diary-foreground)); }
      .chip-ok { background: color-mix(in srgb, var(--state-success) 18%, transparent); color: color-mix(in srgb, var(--state-success) 60%, var(--diary-foreground)); }
      .diary-h3 { font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--diary-foreground); }
      .diary-caption { font-size: 13px; line-height: 1.5; color: var(--diary-muted-foreground); }
      .diary-num { font-variant-numeric: tabular-nums; }
      .checkin-today { background: var(--diary-primary-soft); box-shadow: 0 0 0 2px var(--diary-primary); }
      .celebrate-illustration { display: block; width: 100%; max-width: 260px; height: 9rem; margin-inline: auto; object-fit: contain; }
      nav[data-mobile-nav="global"] { width: 100%; max-width: 28rem; margin-inline: auto; }
      @media (prefers-reduced-motion: reduce) { nav[data-mobile-nav="global"] a, a[data-dom-id], button, article { transition: none !important; } }
    </style>
    <nav data-mobile-nav="global" class="w-full max-w-md mx-auto h-16 grid grid-cols-4 border-t border-[var(--diary-border)] bg-[var(--diary-surface)]"><a href="#" data-nav-key="timeline" data-dom-id="nav-timeline" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--diary-muted-foreground)]"><i data-lucide="clock-3" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap truncate">时间轴</span></a><a href="#" data-nav-key="stats" data-dom-id="nav-stats" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--diary-muted-foreground)]"><i data-lucide="pie-chart" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap truncate">统计</span></a><a href="#" data-nav-key="goals" data-dom-id="nav-goals" data-active="true" aria-current="page" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--diary-primary)]"><i data-lucide="target" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap truncate font-medium">目标</span></a><a href="#" data-nav-key="profile" data-dom-id="nav-profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--diary-muted-foreground)]"><i data-lucide="user-round" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap truncate">我的</span></a></nav>
