    <style id="theme-vars">
/* ============================================================
   Vocab App — Brand CSS
   Design Language: Modern Minimalist + Light Skeuomorphic Cards
   ============================================================ */

/* ---------- Design Tokens (Light Mode) ---------- */
:root {
  /* Brand Primary — 沉稳蓝 #4A90D9 */
  --vocab-primary: #4A90D9;
  --vocab-primary-hover: #3A7BC8;
  --vocab-primary-active: #2E6AB0;
  --vocab-primary-light: #E8F1FB;
  --vocab-primary-lighter: #F4F8FC;
  --vocab-primary-foreground: #FFFFFF;

  /* Neutral Scale */
  --vocab-background: #F8F9FA;
  --vocab-foreground: #2C3E50;
  --vocab-card: #FFFFFF;
  --vocab-card-foreground: #2C3E50;
  --vocab-muted: #F0F2F5;
  --vocab-muted-foreground: #7F8C8D;
  --vocab-border: #E4E7EA;
  --vocab-input: #E4E7EA;
  --vocab-ring: #4A90D9;
  --vocab-popover: #FFFFFF;
  --vocab-popover-foreground: #2C3E50;

  /* State Colors */
  --state-success: #7ED321;
  --state-success-light: #F0FAE6;
  --state-warning: #F5A623;
  --state-warning-light: #FEF5E7;
  --state-error: #E74C3C;
  --state-error-light: #FDECEA;
  --state-info: #4A90D9;
  --state-info-light: #E8F1FB;

  /* Rating Scale Colors */
  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  /* Radius */
  --vocab-radius-small: 4px;
  --vocab-radius-medium: 12px;
  --vocab-radius-large: 16px;
  --vocab-radius-full: 9999px;

  /* Shadow — 仅卡片: #000 opacity 0.05, offset y:2, radius 8 */
  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.05);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.20);

  /* Typography */
  --vocab-font-sans: "Inter", -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --vocab-font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Consolas, monospace;

  /* Spacing (8pt grid) */
  --vocab-space-1: 4px;
  --vocab-space-2: 8px;
  --vocab-space-3: 12px;
  --vocab-space-4: 16px;
  --vocab-space-5: 24px;
  --vocab-space-6: 32px;
  --vocab-space-7: 48px;

  /* Motion */
  --vocab-ease-out: cubic-bezier(0.3, 0, 0, 1);
  --vocab-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --vocab-duration-fast: 160ms;
  --vocab-duration-normal: 300ms;
  --vocab-duration-slow: 480ms;
}

/* ---------- Design Tokens (Dark Mode) ---------- */
.dark {
  --vocab-primary: #5B9FDF;
  --vocab-primary-hover: #6DABE5;
  --vocab-primary-active: #4A90D9;
  --vocab-primary-light: #1E2D40;
  --vocab-primary-lighter: #161E2C;
  --vocab-primary-foreground: #FFFFFF;

  --vocab-background: #14141A;
  --vocab-foreground: #E8E9EC;
  --vocab-card: #1E1E26;
  --vocab-card-foreground: #E8E9EC;
  --vocab-muted: #28282F;
  --vocab-muted-foreground: #9CA3AF;
  --vocab-border: #2E2E38;
  --vocab-input: #2E2E38;
  --vocab-ring: #5B9FDF;
  --vocab-popover: #1E1E26;
  --vocab-popover-foreground: #E8E9EC;

  --state-success: #7ED321;
  --state-success-light: #1A2E0D;
  --state-warning: #F5A623;
  --state-warning-light: #2E2210;
  --state-error: #E74C3C;
  --state-error-light: #2E1512;
  --state-info: #5B9FDF;
  --state-info-light: #1E2D40;

  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.25);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* ---------- Typography Classes ---------- */
.vocab-display {
  font-family: var(--vocab-font-sans);
  font-size: clamp(32px, 8vw, 40px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--vocab-foreground);
}

.vocab-h1 {
  font-family: var(--vocab-font-sans);
  font-size: clamp(24px, 6vw, 28px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--vocab-foreground);
}

.vocab-h2 {
  font-family: var(--vocab-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-h3 {
  font-family: var(--vocab-font-sans);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--vocab-foreground);
}

.vocab-body {
  font-family: var(--vocab-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--vocab-foreground);
}

.vocab-body-sm {
  font-family: var(--vocab-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--vocab-muted-foreground);
}

.vocab-caption {
  font-family: var(--vocab-font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--vocab-muted-foreground);
}

.vocab-mono {
  font-family: var(--vocab-font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  color: var(--vocab-foreground);
}

.vocab-phonetic {
  font-family: var(--vocab-font-mono);
  font-size: 16px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
  font-style: italic;
}

.vocab-word-large {
  font-family: var(--vocab-font-sans);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-phonetic-sm {
  font-family: var(--vocab-font-mono);
  font-size: 14px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        /* ---------- Mobile frame ---------- */
        .detail-container {
          max-width: 430px;
          margin: 0 auto;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: var(--vocab-background);
          font-family: var(--vocab-font-sans);
          color: var(--vocab-foreground);
        }

        /* ---------- Status Bar (44px) ---------- */
        .status-bar {
          height: 44px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          background: var(--vocab-card);
        }
        .status-bar .time {
          font-size: 15px;
          font-weight: 600;
          color: var(--vocab-foreground);
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.01em;
        }
        .status-icons {
          display: flex;
          align-items: center;
          gap: 7px;
          color: var(--vocab-foreground);
        }
        .status-icons svg { display: block; }

        /* ---------- Header ---------- */
        .header {
          height: 56px;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 12px;
          background: var(--vocab-card);
          border-bottom: 1px solid var(--vocab-border);
        }
        .header .icon-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 44px;
          height: 44px;
          border: none;
          background: transparent;
          color: var(--vocab-foreground);
          border-radius: var(--vocab-radius-medium);
          cursor: pointer;
          transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out),
                      transform var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .header .icon-btn:hover { background: var(--vocab-muted); }
        .header .icon-btn:active { background: var(--vocab-muted); transform: scale(0.94); }
        .header .icon-btn svg { display: block; }
        .header .back-btn svg { width: 24px; height: 24px; }
        .header .audio-btn svg { width: 22px; height: 22px; }
        .header .word-title {
          font-family: var(--vocab-font-mono);
          font-size: 18px;
          font-weight: 600;
          color: var(--vocab-foreground);
          letter-spacing: -0.01em;
        }

        /* ---------- Content area ---------- */
        .content-area {
          flex: 1;
          padding: 0 16px 16px;
        }

        /* ---------- Card base ---------- */
        .card {
          background: var(--vocab-card);
          border-radius: var(--vocab-radius-large);
          box-shadow: var(--vocab-shadow-card);
          padding: 24px;
          margin-top: 16px;
        }
        .card.compact { padding: 20px; }

        /* ---------- Word Info ---------- */
        .word-info .word {
          margin: 0;
          font-family: var(--vocab-font-sans);
          font-size: 32px;
          font-weight: 700;
          line-height: 1.15;
          letter-spacing: -0.01em;
          color: var(--vocab-foreground);
        }
        .word-info .phonetic {
          margin: 6px 0 0;
          font-family: var(--vocab-font-mono);
          font-size: 16px;
          font-style: italic;
          color: var(--vocab-muted-foreground);
        }
        .word-info .divider {
          border: none;
          height: 1px;
          background: var(--vocab-border);
          margin: 16px 0;
        }
        .word-type-tag {
          display: inline-flex;
          align-items: center;
          height: 22px;
          padding: 2px 10px;
          border-radius: var(--vocab-radius-full);
          background: var(--vocab-primary-light);
          color: var(--vocab-primary);
          font-size: 12px;
          font-weight: 600;
          line-height: 1;
        }
        .word-info .definition {
          margin: 12px 0 0;
          font-size: 18px;
          font-weight: 500;
          line-height: 1.6;
          color: var(--vocab-foreground);
        }
        .word-info .example {
          margin: 16px 0 0;
          font-size: 14px;
          font-style: italic;
          color: var(--vocab-muted-foreground);
          line-height: 1.6;
          border-left: 3px solid var(--vocab-primary-light);
          padding-left: 12px;
        }

        /* ---------- Section title ---------- */
        .section-title {
          display: flex;
          align-items: center;
          gap: 8px;
          margin: 0 0 16px;
          font-size: 16px;
          font-weight: 600;
          color: var(--vocab-foreground);
        }
        .section-title svg {
          width: 18px;
          height: 18px;
          color: var(--vocab-primary);
          flex-shrink: 0;
        }

        /* ---------- Tag editing ---------- */
        .tag-list {
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding: 2px 2px 4px;
        }
        .tag-item {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          height: 28px;
          padding: 4px 12px;
          border-radius: var(--vocab-radius-full);
          font-size: 13px;
          font-weight: 500;
          line-height: 1;
          white-space: nowrap;
          flex-shrink: 0;
        }
        .tag-item.primary { background: var(--vocab-primary-light); color: var(--vocab-primary); }
        .tag-item.success { background: var(--state-success-light); color: var(--state-success); }
        .tag-item.error { background: var(--state-error-light); color: var(--state-error); }
        .tag-item .remove-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 18px;
          height: 18px;
          margin: 0;
          padding: 0;
          border: none;
          background: transparent;
          color: inherit;
          cursor: pointer;
          border-radius: 50%;
          opacity: 0.65;
          transition: opacity var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .tag-item .remove-btn:hover { opacity: 1; }
        .tag-item .remove-btn svg { width: 14px; height: 14px; display: block; }

        .tag-input-wrap { position: relative; margin-top: 16px; }
        .tag-input {
          width: 100%;
          height: 36px;
          box-sizing: border-box;
          border: 1px solid var(--vocab-border);
          border-radius: var(--vocab-radius-medium);
          padding: 0 44px 0 12px;
          font-size: 14px;
          font-family: var(--vocab-font-sans);
          color: var(--vocab-foreground);
          background: var(--vocab-card);
          outline: none;
          transition: border-color var(--vocab-duration-fast) var(--vocab-ease-out),
                      box-shadow var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .tag-input::placeholder { color: var(--vocab-muted-foreground); }
        .tag-input:focus {
          border-color: var(--vocab-primary);
          box-shadow: 0 0 0 3px var(--vocab-primary-light);
        }
        .tag-add-btn {
          position: absolute;
          right: 6px;
          top: 50%;
          transform: translateY(-50%);
          width: 28px;
          height: 28px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          border: none;
          background: var(--vocab-primary);
          color: var(--vocab-primary-foreground);
          border-radius: var(--vocab-radius-medium);
          cursor: pointer;
          transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out),
                      transform var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .tag-add-btn:hover { background: var(--vocab-primary-hover); }
        .tag-add-btn:active { background: var(--vocab-primary-active); transform: translateY(-50%) scale(0.92); }
        .tag-add-btn svg { width: 18px; height: 18px; display: block; }

        /* ---------- Familiarity ---------- */
        .familiarity .value-display {
          text-align: center;
          font-family: var(--vocab-font-mono);
          font-size: 28px;
          font-weight: 700;
          line-height: 1;
          color: var(--rating-3);
          margin-bottom: 18px;
          font-variant-numeric: tabular-nums;
          transition: color var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .slider-wrap { padding: 0 6px; }
        .familiarity-slider {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          height: 6px;
          border-radius: 3px;
          background: linear-gradient(to right,
            var(--rating-1), var(--rating-2), var(--rating-3), var(--rating-4), var(--rating-5));
          outline: none;
          cursor: pointer;
          margin: 0;
        }
        .familiarity-slider::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: var(--vocab-card);
          border: 2px solid var(--vocab-primary);
          box-shadow: var(--vocab-shadow-card);
          cursor: pointer;
          transition: transform var(--vocab-duration-fast) var(--vocab-ease-out);
        }
        .familiarity-slider::-webkit-slider-thumb:active { transform: scale(1.18); }
        .familiarity-slider::-moz-range-thumb {
          width: 24px;
          height: 24px;
          border-radius: 50%;
          background: var(--vocab-card);
          border: 2px solid var(--vocab-primary);
          box-shadow: var(--vocab-shadow-card);
          cursor: pointer;
        }
        .familiarity-slider:focus-visible {

          flex-direction: column;
          gap: 6px;
          padding-bottom: 12px;

          gap: 8px;

        .timeline-score {

          font-weight: 500;
          color: var(--vocab-foreground);

          align-items: center;

          padding: 2px 10px;

          font-weight: 500;
          line-height: 1;

        .timeline-tag.warning { background: var(--state-warning-light); color: var(--state-warning); }
        .timeline-tag.error { background: var(--state-error-light); color: var(--state-error); }

        /* ---------- Bottom action bar ---------- */
        .bottom-bar {
          position: sticky;
          bottom: 0;
          z-index: 20;
          display: flex;
          gap: 12px;
          padding: 16px;

        .bottom-bar .btn {

        .bottom-bar .btn-secondary {

        .bottom-bar .btn-primary {

        /* ---------- Focus & a11y ---------- */
        button:focus-visible, input:focus-visible {

      <script>
        (function () {
          var slider = document.querySelector('.familiarity-slider');
          var display = document.querySelector('.familiarity .value-display');

          function update() {
            var v = slider.value;
            display.textContent = v;
            display.style.color = 'var(--rating-' + v + ')';
          }
          slider.addEventListener('input', update);
        })();
