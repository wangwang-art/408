/* ============================================================
   Vocab App — Brand CSS
   Design Language: Modern Minimalist + Light Skeuomorphic Cards
   ============================================================ */

/* ---------- Design Tokens (Light Mode) ---------- */
:root {
  /* Brand Primary — 沉稳蓝 #4A90D9 */
  --vocab-primary: #4A90D9;
  --vocab-primary-hover: #3A7BC8;
  --vocab-primary-active: #2E6AB0;
  --vocab-primary-light: #E8F1FB;
  --vocab-primary-lighter: #F4F8FC;
  --vocab-primary-foreground: #FFFFFF;

  /* Neutral Scale */
  --vocab-background: #F8F9FA;
  --vocab-foreground: #2C3E50;
  --vocab-card: #FFFFFF;
  --vocab-card-foreground: #2C3E50;
  --vocab-muted: #F0F2F5;
  --vocab-muted-foreground: #7F8C8D;
  --vocab-border: #E4E7EA;
  --vocab-input: #E4E7EA;
  --vocab-ring: #4A90D9;
  --vocab-popover: #FFFFFF;
  --vocab-popover-foreground: #2C3E50;

  /* State Colors */
  --state-success: #7ED321;
  --state-success-light: #F0FAE6;
  --state-warning: #F5A623;
  --state-warning-light: #FEF5E7;
  --state-error: #E74C3C;
  --state-error-light: #FDECEA;
  --state-info: #4A90D9;
  --state-info-light: #E8F1FB;

  /* Rating Scale Colors */
  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  /* Radius */
  --vocab-radius-small: 4px;
  --vocab-radius-medium: 12px;
  --vocab-radius-large: 16px;
  --vocab-radius-full: 9999px;

  /* Shadow — 仅卡片: #000 opacity 0.05, offset y:2, radius 8 */
  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.05);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.20);

  /* Typography */
  --vocab-font-sans: "Inter", -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --vocab-font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Consolas, monospace;

  /* Spacing (8pt grid) */
  --vocab-space-1: 4px;
  --vocab-space-2: 8px;
  --vocab-space-3: 12px;
  --vocab-space-4: 16px;
  --vocab-space-5: 24px;
  --vocab-space-6: 32px;
  --vocab-space-7: 48px;

  /* Motion */
  --vocab-ease-out: cubic-bezier(0.3, 0, 0, 1);
  --vocab-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --vocab-duration-fast: 160ms;
  --vocab-duration-normal: 300ms;
  --vocab-duration-slow: 480ms;
}

/* ---------- Design Tokens (Dark Mode) ---------- */
.dark {
  --vocab-primary: #5B9FDF;
  --vocab-primary-hover: #6DABE5;
  --vocab-primary-active: #4A90D9;
  --vocab-primary-light: #1E2D40;
  --vocab-primary-lighter: #161E2C;
  --vocab-primary-foreground: #FFFFFF;

  --vocab-background: #14141A;
  --vocab-foreground: #E8E9EC;
  --vocab-card: #1E1E26;
  --vocab-card-foreground: #E8E9EC;
  --vocab-muted: #28282F;
  --vocab-muted-foreground: #9CA3AF;
  --vocab-border: #2E2E38;
  --vocab-input: #2E2E38;
  --vocab-ring: #5B9FDF;
  --vocab-popover: #1E1E26;
  --vocab-popover-foreground: #E8E9EC;

  --state-success: #7ED321;
  --state-success-light: #1A2E0D;
  --state-warning: #F5A623;
  --state-warning-light: #2E2210;
  --state-error: #E74C3C;
  --state-error-light: #2E1512;
  --state-info: #5B9FDF;
  --state-info-light: #1E2D40;

  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.25);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* ---------- Typography Classes ---------- */
.vocab-display {
  font-family: var(--vocab-font-sans);
  font-size: clamp(32px, 8vw, 40px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--vocab-foreground);
}

.vocab-h1 {
  font-family: var(--vocab-font-sans);
  font-size: clamp(24px, 6vw, 28px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--vocab-foreground);
}

.vocab-h2 {
  font-family: var(--vocab-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-h3 {
  font-family: var(--vocab-font-sans);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--vocab-foreground);
}

.vocab-body {
  font-family: var(--vocab-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--vocab-foreground);
}

.vocab-body-sm {
  font-family: var(--vocab-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--vocab-muted-foreground);
}

.vocab-caption {
  font-family: var(--vocab-font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--vocab-muted-foreground);
}

.vocab-mono {
  font-family: var(--vocab-font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  color: var(--vocab-foreground);
}

.vocab-phonetic {
  font-family: var(--vocab-font-mono);
  font-size: 16px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
  font-style: italic;
}

.vocab-word-large {
  font-family: var(--vocab-font-sans);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-phonetic-sm {
  font-family: var(--vocab-font-mono);
  font-size: 14px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
}

    <style id="critical-layout">
  /* ===== Box Model (scoped) ===== */
  .review-shell,
  .review-shell *,
  .review-shell *::before,
  .review-shell *::after {
    box-sizing: border-box;
  }

  /* ===== Shell Wrapper ===== */
  .review-shell {
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--vocab-background);
    display: flex;
    flex-direction: column;
    font-family: var(--vocab-font-sans);
    color: var(--vocab-foreground);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Lucide Icon Defaults ===== */
  .review-shell svg {
    stroke-width: 1.5;
    flex-shrink: 0;
  }

  /* ===== Status Bar ===== */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--vocab-card);
  }
  .status-bar__time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--vocab-foreground);
  }
  .status-bar__icons {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--vocab-foreground);
  }
  .status-bar__icons svg {
    width: 18px;
    height: 18px;
  }

  /* ===== Top Navigation ===== */
  .top-nav {
    flex-shrink: 0;
    background: var(--vocab-card);
  }
  .top-nav__bar {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
  }
  .top-nav__back {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: var(--vocab-radius-medium);
    color: var(--vocab-foreground);
    cursor: pointer;
    transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .top-nav__back:hover {
    background: var(--vocab-muted);
  }
  .top-nav__back:active {
    background: var(--vocab-border);
  }
  .top-nav__back:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .top-nav__back svg {
    width: 24px;
    height: 24px;
  }
  .top-nav__title {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--vocab-foreground);
  }
  .top-nav__progress {
    flex-shrink: 0;
    min-width: 44px;
    text-align: right;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--vocab-muted-foreground);
  }
  .top-nav__progress-line {
    height: 3px;
    background: var(--vocab-border);
    overflow: hidden;
  }
  .top-nav__progress-fill {
    height: 100%;
    width: 100%;
    background: var(--vocab-primary);
  }

  /* ===== Card Area ===== */
  .card-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }
  .card-container {
    width: 85%;
    margin: 0 auto;
    min-height: 280px;
    max-height: 320px;
    overflow: hidden;
    background: var(--vocab-card);
    border-radius: var(--vocab-radius-large);
    box-shadow: var(--vocab-shadow-card);
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
  }

  /* ===== Bottom Action Bar ===== */
  .bottom-action-bar {
    height: 80px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(10px, 3.5vw, 16px);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--vocab-border);
  }
  .bottom-action-bar__left {
    display: flex;
    align-items: center;
    gap: clamp(2px, 1.6vw, 8px);
  }
  .bottom-action-bar__right {
    display: flex;
    align-items: center;
    gap: clamp(4px, 1.86vw, 8px);
  }

  /* ===== Icon Buttons ===== */
  .icon-btn {
    width: clamp(36px, 10.23vw, 44px);
    height: clamp(36px, 10.23vw, 44px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: var(--vocab-radius-medium);
    color: var(--vocab-foreground);
    cursor: pointer;
    transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .icon-btn:hover {
    background: var(--vocab-muted);
  }
  .icon-btn:active {
    background: var(--vocab-border);
  }
  .icon-btn:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .icon-btn svg {
    width: 22px;
    height: 22px;
  }

  /* ===== Rating Buttons ===== */
  .rating-btn {
    width: clamp(36px, 10.23vw, 44px);
    height: clamp(36px, 10.23vw, 44px);
    border: none;
    border-radius: var(--vocab-radius-full);
    color: var(--vocab-primary-foreground);
    font-family: var(--vocab-font-sans);
    font-size: clamp(14px, 3.7vw, 16px);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--vocab-duration-fast) var(--vocab-ease-out),
                opacity var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .rating-btn:hover {
    transform: scale(0.94);
    opacity: 0.9;
  }
  .rating-btn:active {
    transform: scale(0.88);
  }
  .rating-btn:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .rating-btn--1 { background: var(--rating-1); }
  .rating-btn--2 { background: var(--rating-2); }
  .rating-btn--3 { background: var(--rating-3); }
  .rating-btn--4 { background: var(--rating-4); }
  .rating-btn--5 { background: var(--rating-5); }

  /* ===== Reduced Motion ===== */
  @media (prefers-reduced-motion: reduce) {
    .top-nav__back,
    .icon-btn,
    .rating-btn {
      transition: none;
    }
    .rating-btn:hover,
    .rating-btn:active {
      transform: none;
    }
  }
    </style>

        line-height: 1.15;
        letter-spacing: -0.01em;
        color: var(--vocab-foreground);
        text-align: center;
      }
      .card-phonetic {
        font-family: var(--vocab-font-mono);
        font-size: 16px;
        font-weight: 400;
        font-style: italic;
        color: var(--vocab-muted-foreground);
        text-align: center;
      }

      /* Flip hint at the bottom of the card */
      .flip-hint {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        align-self: center;
        color: var(--vocab-muted-foreground);
        font-family: var(--vocab-font-sans);
        font-size: 13px;
        line-height: 1.4;
        animation: hint-pulse 2s ease-in-out infinite;
      }
      .flip-hint svg {
        width: 16px;
        height: 16px;
      }
      @keyframes hint-pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      /* Complete review trigger in the top nav */
      .top-nav__complete {
        flex-shrink: 0;
        min-height: 44px;
        padding: 0 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: var(--vocab-radius-small);
        color: var(--vocab-muted-foreground);
        font-family: var(--vocab-font-sans);
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition: color var(--vocab-duration-fast) var(--vocab-ease-out);
      }
      .top-nav__complete:hover {
        color: var(--vocab-foreground);
      }
      .top-nav__complete:active {
        opacity: 0.7;
      }
      .top-nav__complete:focus-visible {
        outline: 2px solid var(--vocab-ring);
        outline-offset: 2px;
      }

      /* Reduced motion — downgrade pulse + transitions */
      @media (prefers-reduced-motion: reduce) {
        .flip-hint {
          animation: none;
          opacity: 0.85;
        }
        .card-detail-btn,
        .top-nav__complete {
          transition: none;
        }
      }
    </style>

}
.complete-modal {

}
.complete-modal__celebration {

}
.complete-modal__emoji {

}

}
.complete-modal__title {

.complete-modal__stats {

.complete-modal__stat {

}
.complete-modal__stat-label {

}
.complete-modal__stat-divider {

}
.complete-modal__btn {
  width: 100%;
  height: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--vocab-primary);
  color: var(--vocab-primary-foreground);
  border: none;
  border-radius: var(--vocab-radius-medium);
  font-family: var(--vocab-font-sans);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out),
              transform var(--vocab-duration-fast) var(--vocab-ease-out);
}
.complete-modal__btn:hover {
  background: var(--vocab-primary-hover);
}
.complete-modal__btn:active {
  transform: scale(0.97);
}
.complete-modal__btn:focus-visible {
  outline: 2px solid var(--vocab-ring);
  outline-offset: 2px;
}
.complete-modal__btn svg {
  width: 20px;
  height: 20px;
}
@media (prefers-reduced-motion: reduce) {
  .complete-overlay,
  .complete-modal,
  .complete-modal__emoji {
    animation: none;
  }
}
    </style>
