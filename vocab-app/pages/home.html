    <title>主屏</title>
    <style id="theme-vars">
/* ============================================================
   Vocab App — Brand CSS
   Design Language: Modern Minimalist + Light Skeuomorphic Cards
   ============================================================ */

/* ---------- Design Tokens (Light Mode) ---------- */
:root {
  /* Brand Primary — 沉稳蓝 #4A90D9 */
  --vocab-primary: #4A90D9;
  --vocab-primary-hover: #3A7BC8;
  --vocab-primary-active: #2E6AB0;
  --vocab-primary-light: #E8F1FB;
  --vocab-primary-lighter: #F4F8FC;
  --vocab-primary-foreground: #FFFFFF;

  /* Neutral Scale */
  --vocab-background: #F8F9FA;
  --vocab-foreground: #2C3E50;
  --vocab-card: #FFFFFF;
  --vocab-card-foreground: #2C3E50;
  --vocab-muted: #F0F2F5;
  --vocab-muted-foreground: #7F8C8D;
  --vocab-border: #E4E7EA;
  --vocab-input: #E4E7EA;
  --vocab-ring: #4A90D9;
  --vocab-popover: #FFFFFF;
  --vocab-popover-foreground: #2C3E50;

  /* State Colors */
  --state-success: #7ED321;
  --state-success-light: #F0FAE6;
  --state-warning: #F5A623;
  --state-warning-light: #FEF5E7;
  --state-error: #E74C3C;
  --state-error-light: #FDECEA;
  --state-info: #4A90D9;
  --state-info-light: #E8F1FB;

  /* Rating Scale Colors */
  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  /* Radius */
  --vocab-radius-small: 4px;
  --vocab-radius-medium: 12px;
  --vocab-radius-large: 16px;
  --vocab-radius-full: 9999px;

  /* Shadow — 仅卡片: #000 opacity 0.05, offset y:2, radius 8 */
  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.05);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.20);

  /* Typography */
  --vocab-font-sans: "Inter", -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --vocab-font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Consolas, monospace;

  /* Spacing (8pt grid) */
  --vocab-space-1: 4px;
  --vocab-space-2: 8px;
  --vocab-space-3: 12px;
  --vocab-space-4: 16px;
  --vocab-space-5: 24px;
  --vocab-space-6: 32px;
  --vocab-space-7: 48px;

  /* Motion */
  --vocab-ease-out: cubic-bezier(0.3, 0, 0, 1);
  --vocab-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --vocab-duration-fast: 160ms;
  --vocab-duration-normal: 300ms;
  --vocab-duration-slow: 480ms;
}

/* ---------- Design Tokens (Dark Mode) ---------- */
.dark {
  --vocab-primary: #5B9FDF;
  --vocab-primary-hover: #6DABE5;
  --vocab-primary-active: #4A90D9;
  --vocab-primary-light: #1E2D40;
  --vocab-primary-lighter: #161E2C;
  --vocab-primary-foreground: #FFFFFF;

  --vocab-background: #14141A;
  --vocab-foreground: #E8E9EC;
  --vocab-card: #1E1E26;
  --vocab-card-foreground: #E8E9EC;
  --vocab-muted: #28282F;
  --vocab-muted-foreground: #9CA3AF;
  --vocab-border: #2E2E38;
  --vocab-input: #2E2E38;
  --vocab-ring: #5B9FDF;
  --vocab-popover: #1E1E26;
  --vocab-popover-foreground: #E8E9EC;

  --state-success: #7ED321;
  --state-success-light: #1A2E0D;
  --state-warning: #F5A623;
  --state-warning-light: #2E2210;
  --state-error: #E74C3C;
  --state-error-light: #2E1512;
  --state-info: #5B9FDF;
  --state-info-light: #1E2D40;

  --rating-1: #E74C3C;
  --rating-2: #F5A623;
  --rating-3: #F1C40F;
  --rating-4: #A8D88A;
  --rating-5: #7ED321;

  --vocab-shadow-card: 0 2px 8px rgba(0, 0, 0, 0.25);
  --vocab-shadow-float: 0 8px 24px -8px rgba(0, 0, 0, 0.40);
  --vocab-shadow-overlay: 0 24px 60px -20px rgba(0, 0, 0, 0.55);
}

/* ---------- Typography Classes ---------- */
.vocab-display {
  font-family: var(--vocab-font-sans);
  font-size: clamp(32px, 8vw, 40px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  color: var(--vocab-foreground);
}

.vocab-h1 {
  font-family: var(--vocab-font-sans);
  font-size: clamp(24px, 6vw, 28px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--vocab-foreground);
}

.vocab-h2 {
  font-family: var(--vocab-font-sans);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-h3 {
  font-family: var(--vocab-font-sans);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--vocab-foreground);
}

.vocab-body {
  font-family: var(--vocab-font-sans);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.6;
  color: var(--vocab-foreground);
}

.vocab-body-sm {
  font-family: var(--vocab-font-sans);
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--vocab-muted-foreground);
}

.vocab-caption {
  font-family: var(--vocab-font-sans);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  color: var(--vocab-muted-foreground);
}

.vocab-mono {
  font-family: var(--vocab-font-mono);
  font-variant-numeric: tabular-nums;
  font-size: 14px;
  font-weight: 500;
  color: var(--vocab-foreground);
}

.vocab-phonetic {
  font-family: var(--vocab-font-mono);
  font-size: 16px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
  font-style: italic;
}

.vocab-word-large {
  font-family: var(--vocab-font-sans);
  font-size: 32px;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--vocab-foreground);
}

.vocab-phonetic-sm {
  font-family: var(--vocab-font-mono);
  font-size: 14px;
  font-weight: 400;
  color: var(--vocab-muted-foreground);
}

  }

    <style id="critical-layout">
      /* ---------- Home Page Layout-Critical CSS ---------- */
      .home-container {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--vocab-background);
        font-family: var(--vocab-font-sans);
        color: var(--vocab-foreground);
        display: flex;
        flex-direction: column;
      }

      /* Status Bar */
      .status-bar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--vocab-card);
        flex-shrink: 0;
      }
      .status-time {
        font-size: 15px;
        font-weight: 600;
        color: var(--vocab-foreground);
        font-family: var(--vocab-font-mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--vocab-foreground);
      }

      /* Header */
      .app-header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: var(--vocab-card);
        border-bottom: 1px solid var(--vocab-border);
        flex-shrink: 0;
      }
      .header-title {
        font-size: 22px;
        font-weight: 700;
        color: var(--vocab-foreground);
        letter-spacing: -0.015em;
        line-height: 1.2;
        margin: 0;
        word-break: keep-all;
      }
      .header-action {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        border-radius: var(--vocab-radius-medium);
        color: var(--vocab-muted-foreground);
        cursor: pointer;
        transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out),
                    color var(--vocab-duration-fast) var(--vocab-ease-out);
      }
      .header-action:hover {
        background: var(--vocab-muted);
        color: var(--vocab-foreground);
      }
      .header-action:active {
        background: var(--vocab-border);
      }
      .header-action:focus-visible {
        outline: 2px solid var(--vocab-ring);
        outline-offset: 2px;
      }

      /* Content Area */
      .content-area {
        padding: 16px 16px 32px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Word Book Selector Card */
      .book-selector-card {
        background: var(--vocab-card);
        border-radius: var(--vocab-radius-large);
        padding: 16px;
        box-shadow: var(--vocab-shadow-card);
      }
      .book-scroll {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 4px 0 8px;
        margin: -4px 0 -8px;
      }
      .book-item {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .book-card {
        width: 120px;
        height: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: var(--vocab-radius-large);
        font-family: var(--vocab-font-sans);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform var(--vocab-duration-fast) var(--vocab-ease-spring),
                    background-color var(--vocab-duration-fast) var(--vocab-ease-out),
                    color var(--vocab-duration-fast) var(--vocab-ease-out),
                    border-color var(--vocab-duration-fast) var(--vocab-ease-out);
        border: 1px solid transparent;
      }
      .book-card.selected {
        background: var(--vocab-primary);
        color: var(--vocab-primary-foreground);
        transform: scale(1.05);
        border-color: transparent;
      }
      .book-card:not(.selected) {
        background: var(--vocab-card);
        color: var(--vocab-muted-foreground);
        border-color: var(--vocab-border);
      }
      .book-card:not(.selected):hover {
        border-color: var(--vocab-primary);
        color: var(--vocab-primary);
      }
      .book-card:not(.selected):active {
        transform: scale(0.97);
      }
      .book-card:focus-visible {
        outline: 2px solid var(--vocab-ring);
        outline-offset: 2px;
      }
      .book-indicator {
        width: 24px;
        height: 3px;
        border-radius: var(--vocab-radius-full);
        background: transparent;
        transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out);
      }
      .book-indicator.active {
        background: var(--state-warning);
      }

      /* Detail Card */
      .detail-card {
        background: var(--vocab-card);
        border-radius: var(--vocab-radius-large);
        padding: 24px;
        box-shadow: var(--vocab-shadow-card);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .detail-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .detail-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--vocab-foreground);
        margin: 0;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .detail-tag {
        display: inline-flex;
        align-items: center;
        background: var(--vocab-primary-light);
        color: var(--vocab-primary);
        font-size: 12px;
        font-weight: 600;
        padding: 2px 10px;
        border-radius: var(--vocab-radius-full);
        line-height: 1.4;
        white-space: nowrap;
      }
      .detail-stats {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--vocab-muted-foreground);
      }
      .stat-num {
        font-family: var(--vocab-font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--vocab-foreground);
        font-weight: 600;
      }
      .stat-dot {
        color: var(--vocab-border);
      }

      /* Progress */
      .progress-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .progress-bar {
        flex: 1;
        height: 8px;
        background: var(--vocab-muted);
        border-radius: var(--vocab-radius-full);
        overflow: hidden;
      }
      .progress-fill {
        width: 80%;
        height: 100%;
        background: var(--vocab-primary);
        border-radius: var(--vocab-radius-full);
        transition: width var(--vocab-duration-slow) var(--vocab-ease-out);
      }
      .progress-text {
        font-size: 13px;
        font-weight: 600;
        color: var(--vocab-primary);
        font-family: var(--vocab-font-mono);
        font-variant-numeric: tabular-nums;
        min-width: 36px;
        text-align: right;
      }

      /* Download & Hint */
      .download-status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--vocab-muted-foreground);
      }
      .hint-text {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--state-warning);
        line-height: 1.4;
      }

      /* CTA Button */
      .cta-button {
        width: 100%;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--vocab-primary);
        color: var(--vocab-primary-foreground);
        font-family: var(--vocab-font-sans);
        font-size: 17px;
        font-weight: 600;
        border: none;
        border-radius: var(--vocab-radius-medium);
        cursor: pointer;
        transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out),
                    transform var(--vocab-duration-fast) var(--vocab-ease-out);
        margin-top: 4px;
      }
      .cta-button:hover {
        background: var(--vocab-primary-hover);
        transform: translateY(-1px);
      }
      .cta-button:active {
        background: var(--vocab-primary-active);
        transform: scale(0.98);
      }
      .cta-button:focus-visible {
        outline: 2px solid var(--vocab-ring);
        outline-offset: 2px;
      }
      .cta-button svg {
        transition: transform var(--vocab-duration-fast) var(--vocab-ease-out);
      }
      .cta-button:hover svg {
        transform: translateX(2px);
      }

      /* Stats Card */
      .stats-card {
        display: block;
        width: 100%;
        background: var(--vocab-card);
        border-radius: var(--vocab-radius-large);
        padding: 20px;
        box-shadow: var(--vocab-shadow-card);
        border: 1px solid transparent;
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: transform var(--vocab-duration-fast) var(--vocab-ease-out),
                    border-color var(--vocab-duration-fast) var(--vocab-ease-out);
      }
      .stats-card:hover {
        transform: translateY(-1px);
        border-color: var(--vocab-border);
      }
      .stats-card:active {
        transform: scale(0.99);
      }
      .stats-card:focus-visible {
        outline: 2px solid var(--vocab-ring);
        outline-offset: 2px;
      }
      .stats-content {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .stat-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat-label {
        font-size: 13px;
        color: var(--vocab-muted-foreground);
        line-height: 1.4;
      }
      .stat-value-row {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .stat-value {
        font-family: var(--vocab-font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 24px;
        font-weight: 700;
        color: var(--vocab-foreground);
        line-height: 1.1;
      }
      .stat-value.streak {
        color: var(--state-warning);
      }
      .stat-unit {
        font-size: 14px;
        color: var(--vocab-muted-foreground);
      }
      .stats-divider {
        width: 1px;
        align-self: stretch;
        background: var(--vocab-border);
        flex-shrink: 0;
      }
      .flame-icon {
        color: var(--state-warning);
        align-self: center;
      }
      .chevron-icon {
        color: var(--vocab-muted-foreground);
        flex-shrink: 0;
      }

      /* Icon sizes */
      .icon-14 { width: 14px; height: 14px; }
      .icon-16 { width: 16px; height: 16px; }
      .icon-20 { width: 20px; height: 20px; }
      .icon-24 { width: 24px; height: 24px; }

      /* Spinning animation */
      @keyframes vocab-spin {
        to { transform: rotate(360deg); }
      }
      .icon-spin {
        animation: vocab-spin 1s linear infinite;
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .icon-spin {
          animation: none;
        }
        .cta-button,
        .cta-button svg,
        .header-action,
        .book-card,
        .stats-card,
        .progress-fill,
        .book-indicator {
          transition-duration: 0.01ms !important;
        }
        .cta-button:hover,
        .stats-card:hover {
          transform: none;
        }
        .cta-button:hover svg {
          transform: none;
        }
        .book-card.selected {
          transform: none;
        }
        .book-card:not(.selected):active {
          transform: none;
        }
        .cta-button:active {
          transform: none;
        }
        .stats-card:active {
          transform: none;
        }
      }

      /* Touch device hover suppression */
      @media (hover: none) {
        .header-action:hover {
          background: transparent;
          color: var(--vocab-muted-foreground);
        }
        .book-card:not(.selected):hover {
          border-color: var(--vocab-border);
          color: var(--vocab-muted-foreground);
        }
        .cta-button:hover {
          background: var(--vocab-primary);
          transform: none;
        }
        .cta-button:hover svg {
          transform: none;
        }
        .stats-card:hover {
          transform: none;
          border-color: transparent;
        }
      }
    </style>
    <div class="home-container">

      <div class="status-bar" aria-hidden="true">

        <div class="status-icons">

      <!-- Header -->
      <header class="app-header">

      <!-- Content -->
      <div class="content-area">

            <div class="book-item">

              </button>
              <span class="book-indicator" aria-hidden="true"></span>
            </div>
            <div class="book-item">
              <button class="book-card" aria-pressed="false">

                <span>IELTS</span>
              </button>
              <span class="book-indicator" aria-hidden="true"></span>
            </div>
          </div>
        </section>

        <!-- Current Book Detail Card -->
        <section class="detail-card" aria-label="CET-4 详情">

          <div class="progress-row">

              <div class="progress-fill"></div>
            </div>
            <span class="progress-text">80%</span>
          </div>
          <div class="download-status">
            <i data-lucide="loader-2" class="icon-14 icon-spin"></i>
            <span>正在下载音频... 25/800</span>
          </div>
          <div class="hint-text">
            <i data-lucide="info" class="icon-14"></i>
            <span>部分单词将稍后下载发音</span>
          </div>
          <button class="cta-button" data-dom-id="start-review">
            <span>开始复习</span>

          </button>
        </section>

        <!-- Recent Learning Stats Card -->
        <a href="#" class="stats-card" data-dom-id="go-stats" role="button" aria-label="查看统计">

              </div>
            </div>
            <span class="stats-divider" aria-hidden="true"></span>
            <div class="stat-item">
              <span class="stat-label">连续打卡</span>
              <div class="stat-value-row">
                <i data-lucide="flame" class="icon-20 flame-icon"></i>
                <span class="stat-value streak">5</span>
                <span class="stat-unit">天</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="icon-20 chevron-icon"></i>
          </div>
        </a>
      </div>
    </div>
    </main>
