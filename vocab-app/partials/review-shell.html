<style id="critical-layout">
  /* ===== Box Model (scoped) ===== */
  .review-shell,
  .review-shell *,
  .review-shell *::before,
  .review-shell *::after {
    box-sizing: border-box;
  }

  /* ===== Shell Wrapper ===== */
  .review-shell {
    max-width: 430px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--vocab-background);
    display: flex;
    flex-direction: column;
    font-family: var(--vocab-font-sans);
    color: var(--vocab-foreground);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Lucide Icon Defaults ===== */
  .review-shell svg {
    stroke-width: 1.5;
    flex-shrink: 0;
  }

  /* ===== Status Bar ===== */
  .status-bar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--vocab-card);
  }
  .status-bar__time {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--vocab-foreground);
  }
  .status-bar__icons {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--vocab-foreground);
  }
  .status-bar__icons svg {
    width: 18px;
    height: 18px;
  }

  /* ===== Top Navigation ===== */
  .top-nav {
    flex-shrink: 0;
    background: var(--vocab-card);
  }
  .top-nav__bar {
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
  }
  .top-nav__back {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: var(--vocab-radius-medium);
    color: var(--vocab-foreground);
    cursor: pointer;
    transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .top-nav__back:hover {
    background: var(--vocab-muted);
  }
  .top-nav__back:active {
    background: var(--vocab-border);
  }
  .top-nav__back:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .top-nav__back svg {
    width: 24px;
    height: 24px;
  }
  .top-nav__title {
    flex: 1;
    min-width: 0;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--vocab-foreground);
  }
  .top-nav__progress {
    flex-shrink: 0;
    min-width: 44px;
    text-align: right;
    font-size: 14px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--vocab-muted-foreground);
  }
  .top-nav__progress-line {
    height: 3px;
    background: var(--vocab-border);
    overflow: hidden;
  }
  .top-nav__progress-fill {
    height: 100%;
    width: 8%;
    background: var(--vocab-primary);
  }

  /* ===== Card Area ===== */
  .card-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }
  .card-container {
    width: 85%;
    margin: 0 auto;
    min-height: 280px;
    max-height: 320px;
    overflow: hidden;
    background: var(--vocab-card);
    border-radius: var(--vocab-radius-large);
    box-shadow: var(--vocab-shadow-card);
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
  }

  /* ===== Bottom Action Bar ===== */
  .bottom-action-bar {
    height: 80px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(10px, 3.5vw, 16px);
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--vocab-border);
  }
  .bottom-action-bar__left {
    display: flex;
    align-items: center;
    gap: clamp(2px, 1.6vw, 8px);
  }
  .bottom-action-bar__right {
    display: flex;
    align-items: center;
    gap: clamp(4px, 1.86vw, 8px);
  }

  /* ===== Icon Buttons ===== */
  .icon-btn {
    width: clamp(36px, 10.23vw, 44px);
    height: clamp(36px, 10.23vw, 44px);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: var(--vocab-radius-medium);
    color: var(--vocab-foreground);
    cursor: pointer;
    transition: background-color var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .icon-btn:hover {
    background: var(--vocab-muted);
  }
  .icon-btn:active {
    background: var(--vocab-border);
  }
  .icon-btn:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .icon-btn svg {
    width: 22px;
    height: 22px;
  }

  /* ===== Rating Buttons ===== */
  .rating-btn {
    width: clamp(36px, 10.23vw, 44px);
    height: clamp(36px, 10.23vw, 44px);
    border: none;
    border-radius: var(--vocab-radius-full);
    color: var(--vocab-primary-foreground);
    font-family: var(--vocab-font-sans);
    font-size: clamp(14px, 3.7vw, 16px);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform var(--vocab-duration-fast) var(--vocab-ease-out),
                opacity var(--vocab-duration-fast) var(--vocab-ease-out);
  }
  .rating-btn:hover {
    transform: scale(0.94);
    opacity: 0.9;
  }
  .rating-btn:active {
    transform: scale(0.88);
  }
  .rating-btn:focus-visible {
    outline: 2px solid var(--vocab-ring);
    outline-offset: 2px;
  }
  .rating-btn--1 { background: var(--rating-1); }
  .rating-btn--2 { background: var(--rating-2); }
  .rating-btn--3 { background: var(--rating-3); }
  .rating-btn--4 { background: var(--rating-4); }
  .rating-btn--5 { background: var(--rating-5); }

  /* ===== Reduced Motion ===== */
  @media (prefers-reduced-motion: reduce) {
    .top-nav__back,
    .icon-btn,
    .rating-btn {
      transition: none;
    }
    .rating-btn:hover,
    .rating-btn:active {
      transform: none;
    }
  }
</style>

<div class="review-shell">
  <!-- Status Bar -->
  <div class="status-bar" aria-hidden="true">
    <span class="status-bar__time">9:41</span>
    <div class="status-bar__icons">
      <i data-lucide="signal"></i>
      <i data-lucide="wifi"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>

  <!-- Top Navigation -->
  <header class="top-nav">
    <div class="top-nav__bar">
      <button class="top-nav__back" data-dom-id="back-to-home" aria-label="Back">
        <i data-lucide="chevron-left"></i>
      </button>
      <span class="top-nav__title">CET-4</span>
      <span class="top-nav__progress">1/120</span>
    </div>
    <div class="top-nav__progress-line" role="progressbar" aria-valuenow="8" aria-valuemin="0" aria-valuemax="100">
      <div class="top-nav__progress-fill"></div>
    </div>
  </header>

  <!-- Card Container Area -->
  <main class="card-area">
    <div class="card-container">
      <!-- SLOT: card-content -->
    </div>
  </main>

  <!-- Bottom Action Bar -->
  <footer class="bottom-action-bar">
    <div class="bottom-action-bar__left">
      <button class="icon-btn" data-dom-id="audio-btn" aria-label="Play audio">
        <i data-lucide="volume-2"></i>
      </button>
      <button class="icon-btn" data-dom-id="flip-to-back" aria-label="Flip card">
        <i data-lucide="rotate-cw"></i>
      </button>
      <button class="icon-btn" data-dom-id="tags-btn" aria-label="Tags">
        <i data-lucide="tag"></i>
      </button>
    </div>
    <div class="bottom-action-bar__right">
      <button class="rating-btn rating-btn--1" data-dom-id="rating-1" aria-label="Rate 1">1</button>
      <button class="rating-btn rating-btn--2" data-dom-id="rating-2" aria-label="Rate 2">2</button>
      <button class="rating-btn rating-btn--3" data-dom-id="rating-3" aria-label="Rate 3">3</button>
      <button class="rating-btn rating-btn--4" data-dom-id="rating-4" aria-label="Rate 4">4</button>
      <button class="rating-btn rating-btn--5" data-dom-id="rating-5" aria-label="Rate 5">5</button>
    </div>
  </footer>

  <!-- Overlay Slot -->
  <!-- SLOT: overlay-layer -->
</div>
