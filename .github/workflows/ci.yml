name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: time-diary 测试
        run: cd time-diary && node tests/run.js

      - name: vocab-app 测试
        run: cd vocab-app && npm ci && npm test
